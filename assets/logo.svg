<svg viewBox="0 0 820 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D131A"/>
      <stop offset="100%" stop-color="#182430"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F8090"/>
      <stop offset="100%" stop-color="#2FA9BC"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" opacity="0.035"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="818" height="198" rx="22" fill="url(#cardGrad)" stroke="#26333F" stroke-width="1.5"/>
  <rect x="1" y="1" width="818" height="198" rx="22" fill="url(#dots)"/>

  <!-- orbiting repair-loop arc -->
  <path d="M 110 24 A 78 78 0 1 1 40 130" fill="none" stroke="#3C5560" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
  <path d="M 40 130 l -9 -4 l 2 10 z" fill="#3C5560"/>

  <!-- hexagon schema/agent node -->
  <polygon points="110,38 163.7,69 163.7,131 110,162 56.3,131 56.3,69"
           fill="url(#hexGrad)" stroke="#0E3B44" stroke-width="3"/>

  <!-- broken pipe line -->
  <line x1="65" y1="100" x2="95" y2="100" stroke="#0D2B31" stroke-width="6" stroke-linecap="round"/>
  <line x1="125" y1="100" x2="155" y2="100" stroke="#0D2B31" stroke-width="6" stroke-linecap="round"/>
  <circle cx="65" cy="100" r="5.5" fill="#0D2B31"/>
  <circle cx="155" cy="100" r="5.5" fill="#0D2B31"/>

  <!-- sutures healing the break -->
  <line x1="98" y1="88" x2="106" y2="112" stroke="#F2A65A" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="88" x2="118" y2="112" stroke="#F2A65A" stroke-width="4" stroke-linecap="round"/>
  <line x1="122" y1="88" x2="130" y2="112" stroke="#F2A65A" stroke-width="4" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="216" y="94" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700"
        letter-spacing="-0.5" fill="#EDF2F6">Self-Healing Pipeline</text>

  <rect x="217" y="112" width="46" height="4" rx="2" fill="#F2A65A"/>

  <text x="216" y="146" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"
        fill="#7FA3AD">autonomous schema-drift detection &amp; repair</text>

  <text x="216" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400"
        fill="#4E6672">dbt &#183; PostgreSQL &#183; Airflow &#183; LangGraph ReAct agent</text>
</svg>
